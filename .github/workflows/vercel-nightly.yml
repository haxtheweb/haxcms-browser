name: vercel-nightly
# Rebuilds the production site on Vercel every night, so it follows
# haxcms-nodejs main (the runtime and its front-end build) without a commit here.
# Vercel only builds when this repository changes; a Deploy Hook starts the
# same production build of main. That build (npm run build:hosted) checks
# that the Worker boots before deploying; when it cannot, the build fails and
# Vercel keeps serving the last deployment that worked (haxtheweb/issues#3395).
#
# One-time setup:
# 1. Vercel: the project -> Settings -> Git -> Deploy Hooks: create a hook
#    named "nightly" for the branch main, and copy its URL.
# 2. GitHub: Settings -> Secrets and variables -> Actions -> New repository
#    secret: VERCEL_DEPLOY_HOOK = that URL.
# Until the secret is set, this job says so and does nothing. Run it by hand
# from the Actions tab (Run workflow) to rebuild now.
on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC, beside the nightly GitHub Pages build
  workflow_dispatch:
# the hook URL is the only thing used; the job reads nothing from the repository
permissions: {}
concurrency:
  group: vercel-nightly
  cancel-in-progress: false
jobs:
  rebuild:
    name: ask Vercel for a production build of main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set, so nothing was rebuilt. See the setup note at the top of .github/workflows/vercel-nightly.yml."
            exit 0
          fi
          # only ever post to Vercel's deploy hook endpoint
          case "$HOOK" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *)
              echo "::error::VERCEL_DEPLOY_HOOK is not a Vercel deploy hook URL (https://api.vercel.com/v1/integrations/deploy/...)."
              exit 1
              ;;
          esac
          curl -fsS --retry 3 --retry-all-errors --max-time 60 -X POST "$HOOK" -o /dev/null
          echo "Vercel accepted the rebuild of main."
